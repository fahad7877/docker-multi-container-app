services:

  web:
    build: ./web
    container_name: web
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build: ./api
    container_name: api
    environment:
      DB_HOST: db
      POSTGRES_DB: myapp
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
